[project]
name = "pixel-patrol-cellsketch"
version = "0.1.0"
description = "CellSketch — cell component spatial analysis as a PixelPatrol extension"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Helmholtz Imaging Engineering & Support Unit MDC" },
]

dependencies = [
    "pixel-patrol-base>=0.8.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "scikit-image>=0.23.0",
    "tifffile>=2024.5.0",
    "imagecodecs",
    "edt>=2.4.0",
    "fast-simplification>=0.1.6",
    "kimimaro>=4.0.0",
    "crackle-codec",
    "posix-ipc",
    "psutil",
]

[project.scripts]
cellsketch = "pixel_patrol_cellsketch.cli:cli"

[project.entry-points."pixel_patrol.loader_plugins"]
cellsketch_loaders = "pixel_patrol_cellsketch.plugin_registry:register_loader_plugins"

[project.entry-points."pixel_patrol.processor_plugins"]
cellsketch_processors = "pixel_patrol_cellsketch.plugin_registry:register_processor_plugins"

[project.entry-points."pixel_patrol.viewer_extensions"]
cellsketch_viewer = "pixel_patrol_cellsketch.viewer_extensions:get_viewer_extension_dir"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_patrol_cellsketch"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
