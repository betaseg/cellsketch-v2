name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # The viewer widgets are JavaScript, and parts of the suite run them through node: the
      # geometry decoder, the merge arithmetic, the contact clustering, the object overview and
      # every query and chart the widgets build. Without node those tests fail rather than skip.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # pixel-patrol-base comes from git, pinned in packages/anatomy/pyproject.toml, so
      # there is nothing to name here: installing the package brings the right one.
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV=$PWD/.venv uv pip install -e packages/anatomy pytest

      - name: Test
        working-directory: packages/anatomy
        run: ../../.venv/bin/python -m pytest -q
