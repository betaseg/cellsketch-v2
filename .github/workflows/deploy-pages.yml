name: Deploy viewers to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - stats_viewer.html
      - mesh_viewer.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp stats_viewer.html _site/stats_viewer.html
          cp mesh_viewer.html _site/mesh_viewer.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
